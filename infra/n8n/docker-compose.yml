# Self-hosted n8n + Caddy (automatic HTTPS). One instance serves all clients.
# Setup: see README.md.
services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config

  n8n:
    image: docker.n8n.io/n8nio/n8n
    restart: unless-stopped
    environment:
      - N8N_HOST=${N8N_HOST}
      - N8N_PROTOCOL=https
      - WEBHOOK_URL=https://${N8N_HOST}/
      - N8N_PORT=5678
      - GENERIC_TIMEZONE=America/New_York
      # Encrypts stored credentials (your BAAM keys). Keep it stable + backed up.
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY}
    expose:
      - "5678"
    volumes:
      - n8n_data:/home/node/.n8n

volumes:
  caddy_data:
  caddy_config:
  n8n_data:
